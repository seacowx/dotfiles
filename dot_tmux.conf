unbind C-b
set-option -g prefix C-space
bind-key C-space send-prefix

# List of plugins
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# NOTE: Setting for tmux-power
# You can set it to a true color in '#RRGGBB' format
# set -g @tmux_power_theme '#E7E7E8' # dark slate blue
set -g @tmux_power_theme '#5E409D'

# # Or you can set it to 'colorX' which honors your terminal colorscheme
# set -g @tmux_power_theme 'colour3'

# The following colors are used as gradient colors
set -g @tmux_power_g0 "#EEEEEE"
set -g @tmux_power_g1 "#39ADB5"
set -g @tmux_power_g2 "#D2D4D5"
set -g @tmux_power_g3 "#f2efe4"
set -g @tmux_power_g4 "#f2efe4"

set -g @tmux_power_date_format ''
set -g @tmux_power_time_format ''

set -g @tmux_power_show_host false

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
